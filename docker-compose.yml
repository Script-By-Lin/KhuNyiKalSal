services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: khunyikalsal
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:KOkVhtgUPDVkBFjaPekgrdeJLVqLLxQw@postgres.railway.internal:5432/railway}
      SECRET_KEY: ${SECRET_KEY:-your-super-secret-key-change-me-in-production}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      MAX_SOS_PER_DAY: 5
      VOLUNTEER_TIMEOUT_SECONDS: 10
      REDIS_URL: ${REDIS_URL:-redis://default:FjJkHWjFHbWJpeVGXNGttEMAZFXMkOwA@redis.railway.internal:6379}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
